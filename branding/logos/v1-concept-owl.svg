<text x="180" y="250" text-anchor="middle" font-size="26" font-weight="500" letter-spacing="4" fill="#232f4b" font-family="sans-serif">SOPHIA</text>
<text x="180" y="272" text-anchor="middle" font-size="11" fill="#6b6b6b" font-family="sans-serif">AI impact and society, observed</text>

<rect x="360" y="40" width="280" height="280" rx="12" fill="#1b2338"/>
