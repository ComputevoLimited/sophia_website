<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>SOPHIA logo concept - owl mark</title>
<desc>A minimal owl mark with small connected nodes above the head, shown as a light-background version and a dark-background version, both with the SOPHIA wordmark and a short tagline.</desc>

<rect x="40" y="40" width="280" height="280" rx="12" fill="#f5f2ea"/>
<g stroke="#c9a227" stroke-width="1">
<line x1="150" y1="90" x2="180" y2="98"/>
<line x1="180" y1="82" x2="180" y2="98"/>
<line x1="210" y1="90" x2="180" y2="98"/>
</g>
<circle cx="150" cy="90" r="3" fill="#c9a227"/>
<circle cx="180" cy="82" r="3" fill="#c9a227"/>
<circle cx="210" cy="90" r="3" fill="#c9a227"/>
<circle cx="180" cy="150" r="52" fill="#232f4b"/>
<polygon points="146,120 166,98 172,132" fill="#232f4b"/>
<polygon points="214,120 194,98 188,132" fill="#232f4b"/>
<circle cx="162" cy="142" r="10" fill="#c9a227"/>
<circle cx="198" cy="142" r="10" fill="#c9a227"/>
<circle cx="162" cy="142" r="4" fill="#232f4b"/>
<circle cx="198" cy="142" r="4" fill="#232f4b"/>
